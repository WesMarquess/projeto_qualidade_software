spring.application.name=projeto-qualidade-software

# Banco de dados: valores padrao iguais aos do docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas}
spring.datasource.username=${DB_USER:reservas}
spring.datasource.password=${DB_PASSWORD:reservas}

# Cria e atualiza as tabelas automaticamente (apenas desenvolvimento)
spring.jpa.hibernate.ddl-auto=update

# Dados iniciais para teste manual (desligue com APP_SEED_ENABLED=false)
app.seed.enabled=${APP_SEED_ENABLED:true}
